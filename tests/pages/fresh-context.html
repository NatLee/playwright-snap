<!doctype html>
<!-- Green the first time a browser context opens it, red when a cookie from an earlier visit is still there. -->
<html>
<body style="margin: 0">
<script>
  document.body.style.background = document.cookie.includes("seen=1") ? "#f00" : "#0f0";
  document.cookie = "seen=1; max-age=3600";
</script>
</body>
</html>
